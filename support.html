<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>お問い合わせ | ブッシュ</title>
  <style>
    body {
      font-family: sans-serif;
      line-height: 1.9;
      color: #26352b;
      background: #f5f8f4;
      margin: 0;
      padding: 32px 18px;
    }
    main {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 32px;
      border-radius: 16px;
    }
    h1, h2 { color: #397b49; }
    h2 {
      font-size: 19px;
      margin-top: 30px;
    }
    a {
      color: #397b49;
      font-weight: bold;
    }
    .contact {
      background: #edf5ed;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }
    footer {
      margin-top: 36px;
      color: #718075;
      font-size: 13px;
    }
  </style>
</head>
<body>
<main>
  <h1>お問い合わせ</h1>

  <p>
    漢字学習アプリ「ブッシュ」をご利用いただきありがとうございます。
    アプリに関するご質問や不具合の報告、ご意見・ご要望はこちらからお寄せください。
  </p>

  <h2>お問い合わせ方法</h2>

  <div class="contact">
    <p>
      以下のページからお問い合わせ内容を投稿してください。
    </p>
    <p>
      <a href="https://github.com/seikisuruga0810-png/bush-privacy/issues">
        お問い合わせ・不具合報告はこちら
      </a>
    </p>
  </div>

  <h2>お問い合わせの際のお願い</h2>
  <p>
    できるだけ詳しい状況や、使用している端末・OSの情報を
    お知らせいただけると、問題の確認がスムーズになります。
  </p>
  <p>
    氏名、住所、電話番号などの個人情報は投稿しないようお願いいたします。
  </p>

  <footer>
    アプリ名：ブッシュ<br>
    © 2026 BUSH
  </footer>
</main>
</body>
</html>
